name: Protocol Radar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol-radar.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-radar-main
  cancel-in-progress: false

jobs:
  scan:
    name: Read-only public protocol research
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only scanners
        run: python scripts/run_radar.py --output-dir reports
      - name: Store JSON reports as temporary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-radar-report
          path: reports/
          retention-days: 7
          if-no-files-found: warn
