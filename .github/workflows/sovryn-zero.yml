name: Sovryn Zero Rootstock Reward Research

on:
  push:
    branches: [research/liquity-compensation-100]
    paths:
      - 'research/liquity/**'
      - '.github/workflows/sovryn-zero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public ABI helpers
        run: python -m pip install --disable-pip-version-check eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
      - name: Unit test EVM and no-broadcast safety
        working-directory: research/liquity
        run: python -m unittest -v test_liquity_compensation.py test_sovryn_zero.py
      - name: Read-only Rootstock deployed-state and liquidation probe
        working-directory: research/liquity
        run: python sovryn_zero.py
      - name: Preserve read-only results even on RPC failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovryn-zero-readonly
          path: research/liquity/sovryn_reports/*.json
          if-no-files-found: warn
          retention-days: 7
