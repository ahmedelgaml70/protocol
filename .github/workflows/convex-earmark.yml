name: Convex CRV Earmark Reward Research

on:
  push:
    branches: [research/convex-earmark-100]
    paths:
      - 'research/convex/**'
      - '.github/workflows/convex-earmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned ABI / Keccak dependencies
        run: python -m pip install --disable-pip-version-check eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
      - name: Test decoding and no-transaction guarantees
        working-directory: research/convex
        run: python -m unittest -v test_convex_earmark.py test_convex_kicks.py test_convex_lock_candidates.py
      - name: Observe real historical CRV transfers to external callers
        working-directory: research/convex
        run: python convex_earmark.py
      - name: Check funded CVX expired-lock kick receipts and deployed rates
        working-directory: research/convex
        run: python convex_kicks.py
      - name: Sample historical stakers for still-open kick simulations
        working-directory: research/convex
        run: python convex_lock_candidates.py
      - name: Upload bounded read-only results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convex-earnings-historical
          path: research/convex/reports/*.json
          if-no-files-found: warn
          retention-days: 7
