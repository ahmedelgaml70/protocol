name: Keep3r V2 Prefunded Credits Research

on:
  push:
    branches: [research/keep3r-funded-credit-100]
    paths:
      - 'research/keep3r/**'
      - '.github/workflows/keep3r-funded.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funding-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned read-only Ethereum ABI libraries
        run: python -m pip install --disable-pip-version-check eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
      - name: Run unit and transaction-safety tests
        working-directory: research/keep3r
        run: python -m unittest -v test_keep3r_funding.py
      - name: Read funding balances only, never submit work
        working-directory: research/keep3r
        run: python keep3r_funding.py
      - name: Sample verified on-chain keeper payments without transactions
        working-directory: research/keep3r
        run: python keep3r_activity.py
      - name: Retain JSON report even if RPC unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep3r-funding-readonly
          path: research/keep3r/keep3r_reports/*.json
          if-no-files-found: warn
          retention-days: 7
