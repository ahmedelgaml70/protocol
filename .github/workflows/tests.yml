name: Protocol Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q -f .
      - name: Unit tests (no network required)
        run: python -m unittest discover -s tests -v
