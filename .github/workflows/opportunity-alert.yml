name: Protocol Opportunity Alert

on:
  workflow_run:
    workflows: ['Protocol Radar']
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: protocol-radar-alert-writer
  cancel-in-progress: false

jobs:
  review-and-alert:
    name: Screen recent payout evidence
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download read-only radar JSON data
        uses: actions/download-artifact@v4
        with:
          name: protocol-radar-report
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Check evidence gates (no wallet or issue rights used)
        run: python scripts/assess_radar.py --report-dir reports --output reports/alerts.json
      - name: Publish deduplicated research issue (never trade)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_alerts.py --signals reports/alerts.json
