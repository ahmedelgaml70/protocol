name: Moto.fun Real Graduation Bounty Gate (Read Only)

on:
  push:
    branches: [research/motofun-keeper-10]
    paths:
      - 'research/motofun/**'
      - '.github/workflows/motofun-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned keccak hashing
        run: python -m pip install --disable-pip-version-check pycryptodome==3.23.0
      - name: Enforce no mutation
        working-directory: research/motofun
        run: python -m unittest -v test_live.py
      - name: Read official motofun mainnet coin status and actual readiness
        working-directory: research/motofun
        run: python live.py
      - name: Preserve bounded JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motofun-graduation-check
          path: research/motofun/reports/*.json
          if-no-files-found: warn
          retention-days: 7
